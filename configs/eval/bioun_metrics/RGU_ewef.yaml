# @package eval.bioun.metrics.RGU_ewef
defaults:
  - .@pre_compute.RGU_forget_gen: RGU_forget_gen
  - .@pre_compute.RGU_retain_gen: RGU_retain_gen

pre_compute:
  RGU_forget_gen:
    access_key: forget_gen
  RGU_retain_gen:
    access_key: retain_gen

handler: ewef_score
rouge_threshold: 0.5
# certainty_by_index intentionally omitted: no GRADE/Class-LOE metadata yet
# on current LLM-oracle pilot data (PQS<3). Falls back to uniform weight,
# i.e. this degenerates to plain DEF until Stage B0 gold-tier data with
# evidence-certainty fields exists (MASTER_RESEARCH_PLAN.md Sec 4.4, 7.4).
